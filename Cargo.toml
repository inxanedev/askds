[package]
name = "askds"
version = "0.1.0"
edition = "2021"
description = "Ask DeepSeek a question about your current terminal session"
license-file = "LICENSE"
repository = "https://github.com/inxanedev/askds"
readme = "README.md"
keywords = ["deepseek", "ai", "terminal", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
strip = true
lto = true
